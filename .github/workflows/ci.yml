name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download spaCy model (small — CI speed; runtime default is en_core_web_lg)
        run: python -m spacy download en_core_web_sm

      - name: Run test suite
        run: pytest tests/ -v --tb=short

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project + scanning tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Bandit (static security analysis)
        run: bandit -r . -x ./tests,./.venv_test --severity-level medium

      - name: pip-audit (known-vulnerable dependencies)
        run: pip-audit -r requirements.txt
        continue-on-error: true   # advisory — surfaces CVEs without blocking merges on upstream disclosures
