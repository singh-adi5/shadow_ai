name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Primary, blocking test gate. Installs requirements-deploy.txt (no
  # presidio-analyzer/spacy) + the test-only packages — this is exactly
  # what was used to validate the whole suite throughout development, and
  # avoids depending on the full requirements.txt's much larger transitive
  # dependency tree (see requirements.txt header + test-full-nlp below) in
  # the path that gates merges. The app is designed to run fully on the
  # regex fallback without spaCy/Presidio at all (see SECURITY.md "PII
  # Detection Coverage"); the 2 tests that need Presidio itself installed
  # skip cleanly via pytest.importorskip.
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-deploy.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-deploy.txt
          pip install pytest pytest-asyncio httpx

      - name: Run test suite
        run: pytest tests/ -v --tb=short

  # Coverage of the full Presidio/spaCy NLP path (requirements.txt — see
  # its header for the fastapi-cli/typer pin fix this depends on).
  # continue-on-error stays on as a safety net: this dependency tree is
  # inherently more exposed to future upstream pin drift than the lean
  # path above, which is the one that actually gates merges.
  test-full-nlp:
    name: Test (full Presidio/spaCy stack — advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install full dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Run test suite
        run: pytest tests/ -v --tb=short

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-deploy.txt

      - name: Install project + scanning tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-deploy.txt
          pip install bandit pip-audit

      - name: Bandit (static security analysis)
        run: bandit -r . -x ./tests,./.venv_test --severity-level medium

      - name: pip-audit (known-vulnerable dependencies — audits full pin set, incl. Presidio/spaCy, without installing them)
        run: pip-audit -r requirements.txt
        continue-on-error: true   # advisory — surfaces CVEs without blocking merges on upstream disclosures
